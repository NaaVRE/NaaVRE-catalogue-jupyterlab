name: naavre-catalogue-jl-dev

services:
  catalogue-service:
    image: ghcr.io/naavre/naavre-catalogue-service:v0.6.9
    network_mode: host
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - ./catalogue-fixtures.json:/code/app/fixtures.json
    env_file:
      - catalogue-service.env

  catalogue-db:
    image: postgres:17
    network_mode: host
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_PASSWORD: fake-postgres-password

  catalogue-s3:
    image: chrislusf/seaweedfs:4.51
    network_mode: host
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    env_file:
      - catalogue-s3.env
    entrypoint: ["sh", "-e", "/catalogue-s3-entrypoint.sh"]
    volumes:
      - ./catalogue-s3-entrypoint.sh:/catalogue-s3-entrypoint.sh:ro
      - ./notebook.ipynb:/notebook.ipynb
    healthcheck:
      # Healthy once the S3 API is up and the bucket has been created
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/healthz && curl -fs -o /dev/null http://127.0.0.1:9002/buckets/$${BUCKET_NAME}/"]
      interval: 5s
      timeout: 5s
      retries: 5
